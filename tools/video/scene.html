<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600&family=Readex+Pro:wght@600;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #f6efe3; color: #1b2b2c; }
  .stage { position: absolute; inset: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .b1 { width: 520px; height: 520px; background: #5bbfe9; opacity: .45; top: -160px; right: -120px; }
  .b2 { width: 460px; height: 460px; background: #0e9f6e; opacity: .25; bottom: -200px; left: 10%; }
  .b3 { width: 300px; height: 300px; background: #e9cf9f; opacity: .6; top: 35%; left: -80px; }
  .grid { position: absolute; inset: 0; opacity: .45;
    background-image: linear-gradient(#e3d6bf 1px, transparent 1px), linear-gradient(90deg, #e3d6bf 1px, transparent 1px);
    background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, #000 15%, transparent 75%); }
  .layer { position: absolute; inset: 0; }
  .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  .browser { position: absolute; border-radius: 20px; background: #fffaf2; padding: 12px; box-shadow: 0 40px 80px -30px rgba(40,60,50,.45), inset 0 0 0 1px #e3d6bf; }
  .bar { display: flex; align-items: center; gap: 7px; height: 22px; margin-bottom: 10px; direction: ltr; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; }
  .bar i:nth-child(1) { background: #ef8f7d; } .bar i:nth-child(2) { background: #f0c869; } .bar i:nth-child(3) { background: #0e9f6e; }
  .url { margin-left: 14px; flex: 1; max-width: 420px; height: 22px; border-radius: 11px; background: #efe4d1; font: 500 12px/22px 'IBM Plex Sans Arabic'; color: #66675c; padding: 0 12px; }
  .viewport { position: relative; border-radius: 10px; overflow: hidden; background: #efe4d1; }

  .phone { position: absolute; border-radius: 44px; background: #1b2b2c; padding: 11px; box-shadow: 0 40px 70px -25px rgba(20,40,35,.55); }
  .phone .viewport { border-radius: 34px; width: 100%; height: 100%; }
  .notch { position: absolute; top: 18px; left: 50%; width: 90px; height: 22px; margin-left: -45px; border-radius: 12px; background: #1b2b2c; z-index: 5; }

  .copy { position: absolute; }
  .eyebrow { display: inline-block; font: 600 17px 'Readex Pro'; color: #0a7552; background: rgba(14,159,110,.13); padding: 6px 18px; border-radius: 99px; }
  .cap { position: relative; height: 150px; margin-top: 22px; }
  .cap h2 { position: absolute; top: 0; right: 0; width: 100%; font: 700 50px/1.25 'Readex Pro'; }
  .cap h2 b { background: linear-gradient(120deg, #0e9f6e, #2bb3a3 50%, #5bbfe9); -webkit-background-clip: text; color: transparent; }
  .chip { position: absolute; display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 99px; background: #fffaf2;
    font: 600 20px 'Readex Pro'; box-shadow: 0 18px 40px -14px rgba(40,60,50,.4), inset 0 0 0 1px #e3d6bf; white-space: nowrap; }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(120deg, #0e9f6e, #5bbfe9); }
  .wm { position: absolute; bottom: 22px; left: 26px; display: flex; align-items: center; gap: 9px; font: 700 18px 'Readex Pro'; direction: ltr; opacity: .85; }
  .wm .m { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(120deg, #0e9f6e, #5bbfe9); display: grid; place-items: center; }
  .wm .m i { width: 10px; height: 10px; border-radius: 50%; background: #fffaf2; }
  .wm b { background: linear-gradient(120deg, #0e9f6e, #5bbfe9); -webkit-background-clip: text; color: transparent; }
  .edge { position: absolute; top: -10%; bottom: -10%; width: 6px; background: linear-gradient(#5bbfe9, #0e9f6e); box-shadow: 0 0 30px 8px rgba(91,191,233,.6); transform: rotate(16deg); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div>
  <div class="layer" id="root"></div>
  <div class="wm"><span class="m"><i></i></span><span>Prime<b>View</b></span></div>
</div>
<script>
const A = 'file:///C:/Users/acer/Desktop/MrBlack-Video/assets/';
const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const easeIO = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const root = document.getElementById('root');
const h = (html) => { root.insertAdjacentHTML('beforeend', html); };
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

// تبديل نص العنوان: القديم يطلع للأعلى والجديد يدخل من الأسفل
function captions(list, D, t, sel) {
  $$(sel).forEach((el, i) => {
    const s = i * D, inP = i === 0 ? ease(seg(t, .3, .9)) : ease(seg(t, s, s + .5));
    const outP = i === list - 1 ? 0 : ease(seg(t, s + D - .1, s + D + .3));
    el.style.opacity = inP * (1 - outP);
    el.style.transform = `translateY(${(1 - inP) * 40 - outP * 40}px)`;
  });
}

const CLIPS = {
  // ===================== منيو الزبون على الجوال =====================
  menu: {
    dur: 9.6, poster: 3.2,
    build() {
      const shots = ['ph-hero-light.jpg', 'ph-menu-light.jpg', 'ph-menu-added-light.jpg', 'ph-offers-light.jpg', 'ph-cart-light.jpg'];
      const caps = ['الزبون يمسح <b>QR</b>', 'يتصفّح <b>المنيو</b> والأسعار', 'يضيف للسلة <b>بلمسة</b>', 'يشوف <b>العروض</b> والفعاليات', 'ويرسل طلبه <b>للمطبخ</b>'];
      h(`<div class="copy" style="right:90px;top:250px;width:560px">
          <span class="eyebrow">Mr Black · منيو الزبون</span>
          <div class="cap">${caps.map((c) => `<h2 class="c">${c}</h2>`).join('')}</div>
        </div>
        <div class="phone back" style="left:110px;top:150px;width:300px;height:650px;opacity:.9">
          <div class="viewport"><img class="shot" src="${A}ph-menu-dark.jpg"></div></div>
        <div class="phone front" style="left:250px;top:56px;width:318px;height:688px">
          <div class="notch"></div>
          <div class="viewport">${shots.map((s) => `<img class="shot s" src="${A}${s}">`).join('')}</div></div>
        <div class="chip ch" style="left:540px;top:140px"><span class="dot"></span>بدون تطبيق</div>
        <div class="chip ch" style="left:60px;top:560px"><span class="dot"></span>عربي بالكامل</div>`);
      this.n = shots.length;
    },
    at(t) {
      const D = 1.9;
      const intro = ease(seg(t, 0, .9));
      const fy = Math.sin(t * 1.6) * 8;
      $('.front').style.transform = `translateY(${(1 - intro) * 120 + fy}px) rotate(${-2 + Math.sin(t) * .8}deg)`;
      $('.front').style.opacity = intro;
      $('.back').style.transform = `translate(${(1 - ease(seg(t, .3, 1.2))) * 80}px, ${-fy * .6}px) rotate(-9deg)`;
      $('.back').style.opacity = .9 * ease(seg(t, .3, 1.2));
      $('.copy').style.opacity = ease(seg(t, .2, .8));
      $$('.s').forEach((img, i) => {
        const p = i === 0 ? 1 : easeIO(seg(t, i * D - .45, i * D + .1));
        const q = i === this.n - 1 ? 0 : easeIO(seg(t, (i + 1) * D - .45, (i + 1) * D + .1));
        img.style.transform = `translateX(${(1 - p) * -100 + q * 30}%)`;
        img.style.filter = `brightness(${1 - q * .35})`;
        img.style.zIndex = i;
      });
      captions(this.n, D, t, '.c');
      $$('.ch').forEach((c, i) => {
        const p = ease(seg(t, 1 + i * .5, 1.6 + i * .5));
        c.style.opacity = p;
        c.style.transform = `scale(${.6 + p * .4}) translateY(${Math.sin(t * 1.3 + i * 2) * 7}px)`;
      });
    },
  },

  // ===================== لوحة الكاشير والمحاسبة =====================
  casher: {
    dur: 11, poster: 4.6,
    build() {
      const shots = [['c-dashboard.png', 'لوحة تحكم لحظية'], ['c-pos.png', 'نقطة بيع سريعة'], ['c-orders-light.png', 'الطلبات بمؤقّت وتنبيه'], ['c-shifts.png', 'الورديات والصندوق'], ['c-menu.png', 'إدارة المنيو والمخزون']];
      h(`<div class="browser" style="left:100px;top:38px;width:1080px">
          <div class="bar"><i></i><i></i><i></i><span class="url">mr-black · الكاشير والإدارة</span></div>
          <div class="viewport" style="height:${Math.round(1056 * 860 / 1366)}px">${shots.map((s) => `<img class="shot s" src="${A}${s[0]}">`).join('')}</div>
        </div>
        ${shots.map((s) => `<div class="chip c" style="right:110px;bottom:56px"><span class="dot"></span>${s[1]}</div>`).join('')}
        <div class="phone mob" style="left:96px;top:300px;width:210px;height:455px;border-radius:32px;padding:8px">
          <div class="viewport" style="border-radius:25px"><img class="shot" src="${A}c-m-pos.png"></div></div>
        <div class="chip mobchip" style="left:320px;top:640px"><span class="dot"></span>ويشتغل على الجوال</div>`);
      this.n = shots.length;
    },
    at(t) {
      const D = 1.85;
      const intro = ease(seg(t, 0, .9));
      $('.browser').style.transform = `perspective(1600px) rotateX(${(1 - intro) * 18}deg) translateY(${(1 - intro) * 90}px) scale(${.94 + intro * .06})`;
      $('.browser').style.opacity = intro;
      $$('.s').forEach((img, i) => {
        const p = i === 0 ? 1 : easeIO(seg(t, i * D - .35, i * D + .15));
        const local = clamp((t - i * D + .35) / (D + .7));
        img.style.opacity = p;
        img.style.transform = `scale(${1.0 + local * .025})`;
        img.style.transformOrigin = '50% 0%';
        img.style.zIndex = i;
      });
      $$('.c').forEach((el, i) => {
        const s = i * D;
        const inP = i === 0 ? ease(seg(t, .6, 1.1)) : ease(seg(t, s + .1, s + .5));
        const outP = i === this.n - 1 ? ease(seg(t, 9.2, 9.5)) : ease(seg(t, s + D - .15, s + D + .1));
        el.style.opacity = inP * (1 - outP);
        el.style.transform = `translateY(${(1 - inP) * 30}px) scale(${.85 + inP * .15})`;
      });
      const m = ease(seg(t, 9.3, 10.1));
      $('.mob').style.opacity = m;
      $('.mob').style.transform = `translateY(${(1 - m) * 160}px) rotate(${-6 + Math.sin(t * 1.5) * 1}deg)`;
      $('.mobchip').style.opacity = ease(seg(t, 9.7, 10.2));
      $('.mobchip').style.transform = `scale(${.8 + ease(seg(t, 9.7, 10.2)) * .2})`;
    },
  },

  // ===================== نهاري وليلي =====================
  themes: {
    dur: 9, poster: 2.2,
    build() {
      h(`<div class="browser" style="left:330px;top:70px;width:880px">
          <div class="bar"><i></i><i></i><i></i><span class="url">mr-black</span></div>
          <div class="viewport" style="height:${Math.round(856 * 860 / 1366)}px">
            <img class="shot p0 l" src="${A}c-orders-light.png"><img class="shot p0 d" src="${A}c-orders-dark.png">
            <img class="shot p1 l" src="${A}desk-hero-light.jpg"><img class="shot p1 d" src="${A}desk-hero-dark.jpg">
            <div class="edge e0"></div>
          </div></div>
        <div class="phone" style="left:80px;top:150px;width:270px;height:584px;border-radius:38px;padding:9px">
          <div class="notch" style="top:15px;width:70px;margin-left:-35px;height:18px"></div>
          <div class="viewport" style="border-radius:30px">
            <img class="shot p0 l" src="${A}ph-menu-light.jpg"><img class="shot p0 d" src="${A}ph-menu-dark.jpg">
            <img class="shot p1 l" src="${A}ph-hero-light.jpg"><img class="shot p1 d" src="${A}ph-hero-dark.jpg">
            <div class="edge e1"></div>
          </div></div>
        <div class="chip tog" style="left:600px;top:20px;font-size:22px"><span class="ico">☀️</span><span class="lbl">الوضع النهاري</span></div>`);
    },
    at(t) {
      const intro = ease(seg(t, 0, .8));
      $('.browser').style.transform = `translateY(${(1 - intro) * 70}px)`;
      $('.browser').style.opacity = intro;
      $('.phone').style.transform = `translateY(${(1 - ease(seg(t, .2, 1))) * 120 + Math.sin(t * 1.5) * 7}px) rotate(-4deg)`;
      $('.phone').style.opacity = ease(seg(t, .2, 1));
      const pair = t < 4.5 ? 0 : 1;
      const swap = easeIO(seg(t, 4.3, 4.8));            // انتقال للزوج الثاني
      const w = pair === 0 ? easeIO(seg(t, 1.3, 2.4)) : easeIO(seg(t, 5.8, 6.9));
      $$('.p0').forEach((el) => { el.style.opacity = 1 - swap; });
      $$('.p1').forEach((el) => { el.style.opacity = swap; });
      $$(`.p${pair}.d`).forEach((el) => {
        const x0 = 100 - w * 140;
        el.style.clipPath = `polygon(${x0 + 40}% 0, 100% 0, 100% 100%, ${x0}% 100%)`;
      });
      if (pair === 1) $$('.p0.d').forEach((el) => { el.style.clipPath = 'none'; });
      [['.e0', 856], ['.e1', 252]].forEach(([s, W]) => {
        const e = $(s);
        const x0 = 100 - w * 140;
        e.style.left = `${(x0 + 20) / 100 * W}px`;
        e.style.opacity = w > 0 && w < 1 ? 1 : 0;
      });
      const dark = pair === 0 ? w > .5 && swap < .5 : w > .5;
      const tog = $('.tog');
      tog.querySelector('.ico').textContent = dark ? '🌙' : '☀️';
      tog.querySelector('.lbl').textContent = dark ? 'الوضع الليلي' : 'الوضع النهاري';
      const spin = pair === 0 ? seg(t, 1.6, 2.1) : seg(t, 6.1, 6.6);
      tog.style.transform = `scale(${1 + Math.sin(spin * Math.PI) * .12})`;
      tog.style.opacity = ease(seg(t, .5, 1));
      document.body.style.background = '#f6efe3';
    },
  },
};

const clip = CLIPS[new URLSearchParams(location.search).get('clip')];
clip.build();
window.CLIP = { dur: clip.dur, poster: clip.poster };
window.renderAt = (t) => clip.at(t);
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => { throw new Error('img ' + i.src); }))]);
clip.at(0);
</script>
</body>
</html>
